<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corte de Caja - Auto Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --success: #10b981;
            --error: #ef4444;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        .container {
            width: 95%;
            max-width: 1400px;
            padding: 2rem;
            margin-top: 3rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .status-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .pulse-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* ====== FILTROS ====== */
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filters-bar input[type="text"],
        .filters-bar input[type="date"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .filters-bar input[type="text"]:focus,
        .filters-bar input[type="date"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .filters-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        .filters-bar label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* ====== TABLA ====== */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge.exito {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge.ignorado {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        /* ====== PAGINACIÓN ====== */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .pagination-buttons {
            display: flex;
            gap: 6px;
        }

        .pagination-buttons button {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .pagination-buttons button:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
        }

        .pagination-buttons button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-buttons button.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Corte de Caja Sync</h1>
            <p class="subtitle">Transferencia automatizada en tiempo real</p>
        </header>

        <div class="status-card">
            <div class="status-header">
                <h2>Historial de Transferencias</h2>
                <div class="pulse-container">
                    <div class="pulse"></div>
                    <span style="color: var(--text-secondary); font-size: 0.9rem;">Monitor Activo</span>
                </div>
            </div>

            <!-- Barra de Filtros -->
            <div class="filters-bar">
                <input type="text" id="filter-filename" placeholder="🔍 Buscar nombre de archivo..." oninput="applyFilters()">
                <label>
                    Desde
                    <input type="date" id="filter-date-from" onchange="applyFilters()">
                </label>
                <label>
                    Hasta
                    <input type="date" id="filter-date-to" onchange="applyFilters()">
                </label>
                <button class="btn-clear" onclick="clearFilters()">✕ Limpiar</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Fecha / Hora</th>
                        <th>Archivo</th>
                        <th>Estado</th>
                        <th>Destino</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                    <tr>
                        <td colspan="5" class="empty-state">Cargando registros...</td>
                    </tr>
                </tbody>
            </table>

            <!-- Paginación -->
            <div class="pagination-bar" id="pagination-bar" style="display: none;">
                <span class="pagination-info" id="pagination-info"></span>
                <div class="pagination-buttons" id="pagination-buttons"></div>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let filteredLogs = [];
        let currentPage = 1;
        const PAGE_SIZE = 15;

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                allLogs = await response.json();
                applyFilters();
            } catch (error) {
                console.error("Error fetching logs:", error);
            }
        }

        function applyFilters() {
            const searchText = document.getElementById('filter-filename').value.toLowerCase();
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;

            filteredLogs = allLogs.filter(log => {
                // Filtro por nombre de archivo
                if (searchText && !log.filename.toLowerCase().includes(searchText)) {
                    return false;
                }

                // Filtro por fecha desde
                if (dateFrom) {
                    const logDate = log.timestamp.substring(0, 10); // 'YYYY-MM-DD'
                    if (logDate < dateFrom) return false;
                }

                // Filtro por fecha hasta
                if (dateTo) {
                    const logDate = log.timestamp.substring(0, 10);
                    if (logDate > dateTo) return false;
                }

                return true;
            });

            currentPage = 1;
            renderTable();
        }

        function clearFilters() {
            document.getElementById('filter-filename').value = '';
            document.getElementById('filter-date-from').value = '';
            document.getElementById('filter-date-to').value = '';
            applyFilters();
        }

        function renderTable() {
            const tbody = document.getElementById('logs-body');
            const paginationBar = document.getElementById('pagination-bar');

            if (filteredLogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No se encontraron registros con los filtros aplicados.</td></tr>';
                paginationBar.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filteredLogs.length / PAGE_SIZE);
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageLogs = filteredLogs.slice(start, end);

            tbody.innerHTML = '';
            pageLogs.forEach(log => {
                let statusClass = 'error';
                if (log.status === 'EXITO') statusClass = 'exito';
                if (log.status === 'IGNORADO') statusClass = 'ignorado';

                const row = `
                    <tr>
                        <td style="color: var(--text-secondary); vertical-align: top; white-space: nowrap;">${log.timestamp}</td>
                        <td style="font-weight: 500; vertical-align: top;">${log.filename}</td>
                        <td style="vertical-align: top;"><span class="badge ${statusClass}">${log.status}</span></td>
                        <td style="color: var(--text-secondary); vertical-align: top; font-size: 0.85rem;">${log.destino || '-'}</td>
                        <td style="color: var(--text-secondary); line-height: 1.4; vertical-align: top;">${log.message}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Renderizar paginación
            paginationBar.style.display = 'flex';
            document.getElementById('pagination-info').textContent = 
                `Mostrando ${start + 1}-${Math.min(end, filteredLogs.length)} de ${filteredLogs.length} registros`;

            let buttonsHTML = '';
            buttonsHTML += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Anterior</button>`;

            // Mostrar máximo 5 páginas alrededor de la actual
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

            for (let i = startPage; i <= endPage; i++) {
                buttonsHTML += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }

            buttonsHTML += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Siguiente →</button>`;

            document.getElementById('pagination-buttons').innerHTML = buttonsHTML;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredLogs.length / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // Carga inicial y auto-refresh
        fetchLogs();
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
